<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sonsuz Maymun Teoremi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%92%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Üst şerit: az önce ürettiğimiz her karakterin ham dökümü (doğru/yanlış hepsi) -->
<header class="typed-band">
  <p class="band-label">yazdıklarımız</p>
  <div class="typed-feed" id="typed-feed" aria-live="off"></div>
</header>

<main class="paper">

  <div class="title-block">
    <h1>Sonsuz Maymun Teoremi</h1>
    <p class="subtitle">Yeterince maymun, yeterince tuş, sonunda Hamlet.</p>
  </div>

  <section class="stats">
    <div class="stat">
      <span class="stat-label">Seri</span>
      <span class="stat-value" id="streak-value">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Rekor</span>
      <span class="stat-value" id="best-value">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Toplam Deneme</span>
      <span class="stat-value" id="rolls-value">0</span>
    </div>
  </section>

  <section class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="progress-label" id="progress-label">%0 tamamlandı</span>
  </section>

  <section class="rolled-char-wrap">
    <div class="rolled-char" id="rolled-char">&nbsp;</div>
    <p class="hint">Basmak için düğmeye tıkla ya da klavyeden herhangi bir tuşa bas</p>
  </section>

  <section class="controls">
    <button id="roll-button" class="type-button">TUŞA BAS</button>
  </section>

  <p id="status-line" class="status-line">Hazır. Tuşa bas.</p>

</main>

<!-- Alt şerit: hedef metin — Hamlet'in tamamı en baştan, tutturduğumuz kısım vurgulu -->
<footer class="target-band">
  <p class="band-label">hamlet — "to be, or not to be"</p>
  <div class="target-feed" id="target-feed" aria-live="polite">
    <p class="target-text" id="target-text"></p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
