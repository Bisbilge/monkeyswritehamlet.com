services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY .env dosyasinda tanimli olmali}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-https://monkeyswritehamlet.com}
      - COOKIE_SECURE=true
    volumes:
      - ./data:/data
    ports:
      # Sadece localhost'a bagla: disariya acilan tek kapi nginx (443) olsun.
      - "127.0.0.1:8000:8000"
