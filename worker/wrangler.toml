name = "monkey-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Ücretsiz *.workers.dev subdomain'i kullanıyoruz — özel domain gerekmiyor.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "monkey-db"
# `wrangler d1 create monkey-db` komutunun çıktısındaki database_id'yi
# buraya yapıştırın (bkz. DEPLOY.md § Cloudflare kurulumu).
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# GitHub Pages sitenizin origin'i (path YOK, sonunda / da yok).
# Kullanıcı adınız farklıysa ya da Pages'i farklı bir isimle
# yayınlıyorsanız burayı güncelleyin.
FRONTEND_ORIGINS = "https://bisbilge.github.io,http://localhost:5500,http://127.0.0.1:5500"

# SECRET_KEY burada YOK — bu bir sır, wrangler.toml'a (git'e) hiç girmemeli.
# `wrangler secret put SECRET_KEY` ile ayrı olarak ayarlanır
# (GitHub Actions workflow'u bunu her deploy'da otomatik yapar, bkz.
# .github/workflows/deploy-worker.yml).
